name: Release Commission

on:
  push:
    branches: [main]
    paths:
      - 'services/commission/**'
      - 'services/_shared/**'
      - '.github/workflows/release-commission.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-commission
  cancel-in-progress: false

jobs:
  build-and-register:
    name: Build, push, and register Commission task
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: devops-g2/commission
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ECR is IMMUTABLE: re-running on a commit already built fails the
          # push. Reuse the existing image so the registered revision is
          # still the exact bytes for this commit.
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region us-east-2 \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"

          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "Image for $IMAGE_TAG already in ECR, reusing $DIGEST"
          else
            # Built from the repo root so services/_shared is in the context.
            docker build -f services/commission/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" | cut -d@ -f2)"
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition devops-g2-commission \
            --region us-east-2 \
            --query 'taskDefinition' > task-def.json

      - name: Render new task definition with updated image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: commission
          image: ${{ steps.build.outputs.image }}

      # No aws-actions/amazon-ecs-deploy-task-definition here: Commission is
      # a one-shot worker with no ECS service to update. Registering the new
      # revision is enough — the EventBridge schedule runs the latest ACTIVE
      # revision each time it fires.
      - name: Register new task definition revision
        run: |
          # register-task-definition rejects the read-only fields that
          # describe-task-definition returns (taskDefinitionArn, revision,
          # status, ...). deploy-task-definition@v2 strips them internally,
          # but we register directly, so strip them here.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' \
            "${{ steps.render.outputs.task-definition }}" > clean-task-def.json
          aws ecs register-task-definition \
            --cli-input-json file://clean-task-def.json \
            --region us-east-2 \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text

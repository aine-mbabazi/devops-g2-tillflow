name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same PR are worth cancelling; their plans would
# contend on the Terraform state lock for a result nobody will read.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments-tests:
    name: Payments — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/payments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (70% line floor)
        run: npm run coverage

  pos-tests:
    name: POS — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/pos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (70% line floor)
        run: npm run coverage

  commission-tests:
    name: Commission — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commission
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/commission/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (70% line floor)
        run: npm run coverage

  runbook-anchors:
    name: Alarms — runbook anchors resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # An alarm that links to a runbook section nobody wrote costs the on-call
      # engineer a page load to discover there is no guidance, at the moment
      # they least have time for it. This is the mechanical half of the rule in
      # docs/runbook.md: add an alarm, add its section in the same PR.
      - name: Check every alarm links to a real runbook section
        run: node scripts/check-alarm-runbook-anchors.mjs

  notifier-tests:
    name: Slack notifier — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the renderer is a pure function with no dependencies,
      # which is why the AWS SDK import in the handler is lazy.
      - name: Run tests
        run: node --test infra/main/lambda/slack-notifier/test.mjs

  k6-smoke:
    name: k6 — golden path smoke
    runs-on: ubuntu-latest
    needs: [pos-tests, payments-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: grafana/setup-k6-action@v1

      - name: Install service dependencies
        run: |
          npm ci --prefix services/payments
          npm ci --prefix services/pos

      # DARAJA_MODE=fake is the brief's rule, not a convenience: "CI and k6 must
      # use a deterministic fake adapter — never real money or customer data".
      # The secret below is a throwaway used only to sign requests between two
      # processes on this runner; it is not the deployed SERVICE_AUTH_SECRET.
      - name: Start Payments and POS
        env:
          SERVICE_AUTH_SECRET: ci-smoke-secret
        run: |
          (cd services/payments && SERVICE_AUTH_SECRET=$SERVICE_AUTH_SECRET DARAJA_MODE=fake \
            PAYMENT_STORE=memory HOST=127.0.0.1 PORT=3001 node src/server.js &)
          (cd services/pos && SERVICE_AUTH_SECRET=$SERVICE_AUTH_SECRET \
            PAYMENTS_BASE_URL=http://127.0.0.1:3001 POS_STORE=memory \
            HOST=127.0.0.1 PORT=3002 node src/server.js &)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3002/health > /dev/null \
               && curl -sf http://127.0.0.1:3001/health > /dev/null; then
              echo "both services up"; exit 0
            fi
            sleep 1
          done
          echo "services did not become healthy in 30s"; exit 1

      # Runs the same profile, with the same thresholds, that produced the
      # committed evidence — including tillflow_duplicate_dispatch == 0, which
      # is what actually gates this job. A PR that reintroduces a double
      # dispatch under concurrency fails here rather than in production.
      - name: Run k6 smoke
        env:
          SERVICE_AUTH_SECRET: ci-smoke-secret
        run: k6 run load/k6/smoke.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: evidence/reliability-operations/k6/smoke.json
          if-no-files-found: warn

  payments-docker-build:
    name: Payments — Docker build validation
    runs-on: ubuntu-latest
    needs: payments-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        # Built from the repo root: the image needs services/_shared inside
        # its build context, not just services/payments.
        run: docker build -f services/payments/Dockerfile -t payments-pr-check .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Both scans run Trivy from its published image rather than via
  # aquasecurity/trivy-action, whose install step failed outright here — the
  # scan never ran. Pulled from ghcr.io authenticated with GITHUB_TOKEN:
  # ECR Public and Docker Hub both throttle anonymous pulls by IP, and
  # GitHub-hosted runners share addresses, so ECR Public returned
  # "toomanyrequests" immediately.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --ignore-unfixed: a finding with no available fix is not something this
      # PR can act on. The brief's gate is fixable HIGH/CRITICAL.
      - name: Scan service dependencies
        run: |
          docker run --rm -v "$PWD:/workspace" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            filesystem \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              /workspace/services

  iac-scan:
    name: IaC scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Scan Terraform
        run: |
          docker run --rm -v "$PWD:/workspace" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            config \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignorefile /workspace/infra/.trivyignore.yaml \
              /workspace/infra

  terraform-plan:
    name: Terraform plan (infra/main)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_service_auth_secret_value: ${{ secrets.TF_VAR_SERVICE_AUTH_SECRET_VALUE }}
        run: terraform plan

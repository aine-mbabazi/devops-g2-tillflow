name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same PR are worth cancelling; their plans would
# contend on the Terraform state lock for a result nobody will read.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payments-tests:
    name: Payments — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/payments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  payments-docker-build:
    name: Payments — Docker build validation
    runs-on: ubuntu-latest
    needs: payments-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t payments-pr-check services/payments

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Both scans run Trivy from its published image rather than via
  # aquasecurity/trivy-action. The action installs the binary through a shell
  # script fetched from the Trivy repo, and that install step failed outright
  # here — the scan itself never ran. The image has no such step, and pins the
  # scanner version the same way.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --ignore-unfixed: a finding with no available fix is not something this
      # PR can act on. The brief's gate is fixable HIGH/CRITICAL.
      - name: Scan service dependencies
        run: |
          docker run --rm -v "$PWD:/workspace" \
            public.ecr.aws/aquasecurity/trivy:0.65.0 \
            filesystem \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              /workspace/services

  iac-scan:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform
        run: |
          docker run --rm -v "$PWD:/workspace" \
            public.ecr.aws/aquasecurity/trivy:0.65.0 \
            config \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --no-progress \
              /workspace/infra

  terraform-plan:
    name: Terraform plan (infra/main)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan

name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  payments-tests:
    name: Payments — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

  payments-docker-build:
    name: Payments — Docker build validation
    runs-on: ubuntu-latest
    needs: payments-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t payments-pr-check services/payments

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-plan:
    name: Terraform plan (infra/main)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan

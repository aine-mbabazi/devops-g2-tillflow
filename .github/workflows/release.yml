name: Deploy Payments

on:
  push:
    branches: [main]
    paths:
      - 'services/payments/**'
      - 'services/_shared/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read
  id-token: write

# Never cancel: a cancelled run can leave the service mid-rollout with the
# deployment circuit breaker still watching it.
concurrency:
  group: release-payments
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, push, and deploy Payments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: devops-g2/payments
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The ECR repository is IMMUTABLE, so re-running this workflow on a
          # commit that was already built fails the push. Reuse the existing
          # image instead: same commit, same digest, so the deploy below is
          # still exact.
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region us-east-2 \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"

          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "Image for $IMAGE_TAG already in ECR, reusing $DIGEST"
          else
            # Built from the repo root so services/_shared is in the context.
            docker build -f services/payments/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            # Read the digest back from the pushed image rather than querying
            # the registry again, so the deploy uses the bytes just pushed.
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" | cut -d@ -f2)"
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      # The SBOM is generated from the image that is actually being shipped,
      # by digest, not from the source tree. A source-derived SBOM describes
      # what the lockfile said; this describes what is in the artifact.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: cyclonedx-json
          output-file: sbom-payments.cdx.json
          artifact-name: sbom-payments-${{ github.sha }}.cdx.json

      # Captured before the deploy so there is something concrete to roll back
      # to. Reading it afterwards would return the revision just deployed.
      - name: Record the currently deployed task definition
        id: previous
        run: |
          set -euo pipefail
          PREV="$(aws ecs describe-services \
            --cluster devops-g2 --services devops-g2-payments --region us-east-2 \
            --query 'services[0].taskDefinition' --output text)"
          echo "Currently deployed: $PREV"
          echo "arn=$PREV" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition devops-g2-payments \
            --region us-east-2 \
            --query 'taskDefinition' > task-def.json

      - name: Render new task definition with updated image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: payments
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: devops-g2-payments
          cluster: devops-g2
          wait-for-service-stability: true

      # Post-deploy smoke. wait-for-service-stability above proves ECS stopped
      # churning; it does not prove the thing that is running is the thing that
      # was built, or that a target is passing its health check.
      - name: Post-deploy smoke
        id: smoke
        run: |
          set -euo pipefail

          echo "--- deployment reached a steady state with the new revision"
          ROLLOUT="$(aws ecs describe-services \
            --cluster devops-g2 --services devops-g2-payments --region us-east-2 \
            --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' --output text)"
          echo "rolloutState=$ROLLOUT"
          [ "$ROLLOUT" = "COMPLETED" ] || { echo "::error::rollout did not complete"; exit 1; }

          echo "--- every target is healthy"
          TG="$(aws elbv2 describe-target-groups \
            --names devops-g2-payments-tg --region us-east-2 \
            --query 'TargetGroups[0].TargetGroupArn' --output text)"
          UNHEALTHY="$(aws elbv2 describe-target-health \
            --target-group-arn "$TG" --region us-east-2 \
            --query 'length(TargetHealthDescriptions[?TargetHealth.State!=`healthy`])' --output text)"
          echo "unhealthy targets=$UNHEALTHY"
          [ "$UNHEALTHY" = "0" ] || { echo "::error::$UNHEALTHY target(s) not healthy"; exit 1; }

          # The check that actually ties runtime to the pipeline: the running
          # task must be the exact digest this workflow pushed. A green
          # rollout of the wrong image is the failure this catches.
          echo "--- running image digest matches what was just built"
          TASK_DEF="$(aws ecs describe-services \
            --cluster devops-g2 --services devops-g2-payments --region us-east-2 \
            --query 'services[0].taskDefinition' --output text)"
          RUNNING="$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" --region us-east-2 \
            --query "taskDefinition.containerDefinitions[?name=='payments'].image" --output text)"
          EXPECTED="${{ steps.build.outputs.image }}"
          echo "running=$RUNNING"
          echo "expected=$EXPECTED"
          [ "$RUNNING" = "$EXPECTED" ] || { echo "::error::deployed image is not the image built by this run"; exit 1; }

          # Payments owns /health and /ready on the shared listener, so it is
          # the one service reachable end to end from outside: through API
          # Gateway, over the VPC Link, to the internal ALB. POS is only
          # exposed at /sales*, which needs a signed service-auth header this
          # workflow deliberately does not hold.
          echo "--- reachable through the public entry point"
          API="$(aws apigatewayv2 get-apis --region us-east-2 \
            --query "Items[?Name=='devops-g2-api'].ApiEndpoint | [0]" --output text)"
          if [ -n "$API" ] && [ "$API" != "None" ]; then
            BODY="$(curl -fsS --max-time 15 "$API/health")"
            echo "GET /health -> $BODY"
            echo "$BODY" | grep -q '"status":"ok"' || { echo "::error::/health did not report ok"; exit 1; }
          else
            echo "::warning::No API Gateway found; skipped the external reachability check"
          fi
          echo "smoke passed"

      # Runs when the deploy or the smoke failed. ECS will happily sit on a
      # broken-but-stable revision, so the rollback is explicit, and the job
      # still fails afterwards — a recovered deploy is not a successful one.
      - name: Roll back on failure
        if: failure() && steps.previous.outputs.arn != ''
        run: |
          set -euo pipefail
          echo "::warning::Deploy or smoke failed — rolling back to ${{ steps.previous.outputs.arn }}"
          aws ecs update-service \
            --cluster devops-g2 --service devops-g2-payments --region us-east-2 \
            --task-definition "${{ steps.previous.outputs.arn }}" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable \
            --cluster devops-g2 --services devops-g2-payments --region us-east-2
          echo "Rolled back to ${{ steps.previous.outputs.arn }}"
          exit 1

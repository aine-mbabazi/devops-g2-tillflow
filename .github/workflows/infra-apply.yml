name: Infra Apply

on:
  push:
    branches: [main]
    paths:
      - 'infra/main/**'
      - '.github/workflows/infra-apply.yml'
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Break-glass only. A Terraform resource address to limit this run to,
          e.g. aws_iam_role_policy.github_actions. Leave blank for a normal
          full plan and apply.
        required: false
        default: ''

permissions:
  contents: read

# Terraform state takes a single lock. Queue runs instead of racing, and never
# cancel one mid-apply — a half-applied run leaves the lock held.
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      # The canary in synthetics.tf is gated on this var (empty = disabled);
      # read it from the gateway's own output rather than hardcoding the
      # invoke URL, so it stays correct if the gateway is ever recreated.
      # Falls back to empty (probe stays off) if the output doesn't exist yet
      # — e.g. a fresh account applying before the API Gateway branch has run.
      - name: Read API Gateway invoke URL for the synthetic probe
        run: |
          echo "TF_VAR_synthetic_probe_url=$(terraform output -raw api_gateway_invoke_url 2>/dev/null || echo '')" >> "$GITHUB_ENV"

      # A targeted plan exists for one situation: the plan role has lost the
      # ability to READ a resource the stack already owns, so a full plan fails
      # at refresh before it can propose the fix — including when the fix is a
      # permission on that same role. That is a genuine deadlock, because the
      # apply job's plan uses the same role.
      #
      # -target limits refresh to the addressed resource and its dependencies,
      # so the unreadable resource is never touched and the permission can be
      # granted through the pipeline instead of from somebody's laptop.
      #
      # It is break-glass: a targeted apply leaves state partially refreshed, so
      # the next run must be a normal full one. The warning below says so in the
      # run log, and the plan is still saved and still gated on approval.
      - name: Terraform plan
        env:
          TF_VAR_service_auth_secret_value: ${{ secrets.TF_VAR_SERVICE_AUTH_SECRET_VALUE }}
          PLAN_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [ -n "${PLAN_TARGET:-}" ]; then
            echo "::warning::Break-glass targeted plan limited to '${PLAN_TARGET}'. State will be only partially refreshed — run a full apply next."
            terraform plan -out=tfplan -input=false -target="${PLAN_TARGET}"
          else
            terraform plan -out=tfplan -input=false
          fi

      - name: Show plan
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/main/tfplan
          retention-days: 5
          if-no-files-found: error

      # Every archive_file package, not an enumerated list of them.
      #
      # archive_file is a data source: it writes its zip while the PLAN is
      # being computed, in this job's workspace. `terraform apply tfplan` does
      # not re-read data sources, and .build/ is gitignored, so the apply job's
      # fresh checkout has no zips at all — it fails with "open
      # ./.build/<name>.zip: no such file or directory".
      #
      # This was already worked around for the Lambda by naming its zip
      # explicitly. The synthetic probe's canary zip was then added without a
      # matching step, and the apply failed on exactly that. Uploading the
      # whole directory means the next archive_file cannot reintroduce this.
      #
      # It also keeps the approval honest: the apply runs the same bytes the
      # reviewer's plan was computed from, rather than a zip rebuilt later.
      - name: Upload Terraform-built packages
        uses: actions/upload-artifact@v4
        with:
          name: tf-build-${{ github.run_id }}
          path: infra/main/.build/
          retention-days: 5
          if-no-files-found: error
          # .build is a dot-directory, and upload-artifact v4 defaults
          # include-hidden-files to false — so a directory path matches nothing
          # and the step fails with "No files were found". The step this
          # replaced pointed at one explicit file, which is why it never hit
          # this. Without it the plan job fails after a completely successful
          # plan, which reads as a Terraform problem and is not one.
          include-hidden-files: true

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    # Requires a reviewer on the protected `production` environment before the
    # job starts. That approval is the release gate.
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_APPLY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      # Kept in parity with the plan job's step, even though a saved-plan
      # apply doesn't re-evaluate this variable — see that job for why it's
      # read from state rather than hardcoded.
      - name: Read API Gateway invoke URL for the synthetic probe
        run: |
          echo "TF_VAR_synthetic_probe_url=$(terraform output -raw api_gateway_invoke_url 2>/dev/null || echo '')" >> "$GITHUB_ENV"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/main

      - name: Download Terraform-built packages
        uses: actions/download-artifact@v4
        with:
          name: tf-build-${{ github.run_id }}
          path: infra/main/.build

      # Applying the saved plan file, not a freshly computed one: what a
      # reviewer approved is exactly what reaches AWS. Terraform refuses the
      # apply if state moved since the plan.
      - name: Terraform apply
        env:
          TF_VAR_service_auth_secret_value: ${{ secrets.TF_VAR_SERVICE_AUTH_SECRET_VALUE }}
        run: terraform apply -input=false tfplan
